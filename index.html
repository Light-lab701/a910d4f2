<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Central Hub</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0A0A0C;
    --surface:   #121215;
    --surface-2: #17171B;
    --border:    #24242A;
    --border-hi: #33333B;
    --text:      #E7E7EA;
    --text-2:    #8A8A93;
    --text-3:    #5C5C64;
    --accent:    #F5A623;
    --accent-dim: rgba(245, 166, 35, 0.12);
    --danger:    #E16A7C;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif;
    overflow: hidden;
  }

  /* ─── PIN gate ──────────────────────────────────────────── */
  #gate {
    position: fixed; inset: 0; z-index: 100;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 18px;
  }
  #gate.hidden { display: none; }
  #gate .brand {
    font-size: 13px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--text-3);
  }
  #gate input {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); font-size: 28px; letter-spacing: 14px;
    text-align: center; width: 200px; padding: 14px 10px;
    border-radius: 6px; font-family: "IBM Plex Mono", monospace;
  }
  #gate input:focus { outline: none; border-color: var(--accent); }
  #gate .error { color: var(--danger); font-size: 12px; height: 14px; }
  #gate .bio-btn {
    background: transparent; border: 1px solid var(--border-hi);
    color: var(--text-2); font-size: 12px; padding: 8px 14px;
    border-radius: 6px; cursor: pointer; font-family: inherit;
  }
  #gate .bio-btn:hover { color: var(--accent); border-color: var(--accent); }
  #gate .bio-btn.hidden, #gate .bio-offer.hidden { display: none; }
  #gate .bio-offer {
    display: flex; flex-direction: column; gap: 10px; align-items: center;
    font-size: 12px; color: var(--text-2); max-width: 240px; text-align: center;
  }
  #gate .bio-offer-actions { display: flex; gap: 8px; }
  #gate .bio-offer-actions button {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); font-size: 12px; padding: 6px 12px;
    border-radius: 6px; cursor: pointer; font-family: inherit;
  }
  #gate .bio-offer-actions button:hover { border-color: var(--accent); }

  /* ─── Shell ─────────────────────────────────────────────── */
  #shell { display: flex; height: 100vh; }
  #shell.hidden { display: none; }

  #sidebar {
    width: 220px; flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    margin-left: 0;
    transition: margin-left 0.25s ease;
    overflow: hidden;
  }
  #shell.collapsed #sidebar { margin-left: -220px; }

  #sidebar-toggle {
    position: fixed; top: 14px; left: 220px; z-index: 50;
    width: 20px; height: 34px;
    background: var(--surface); border: 1px solid var(--border); border-left: none;
    border-radius: 0 6px 6px 0;
    color: var(--text-2); font-size: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: left 0.25s ease;
  }
  #sidebar-toggle:hover { color: var(--accent); border-color: var(--border-hi); }
  #shell.collapsed #sidebar-toggle { left: 0; }

  #sidebar .logo {
    padding: 18px 16px; font-size: 13px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase;
    color: var(--text); border-bottom: 1px solid var(--border);
  }
  #sidebar .logo span { color: var(--accent); }

  #nav { flex: 1; padding: 10px 0; overflow-y: auto; }

  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; cursor: pointer;
    color: var(--text-2); font-size: 13px; font-weight: 500;
    border-left: 2px solid transparent;
  }
  .nav-item:hover { color: var(--text); background: var(--surface-2); }
  .nav-item.active {
    color: var(--text); background: var(--accent-dim);
    border-left-color: var(--accent);
  }
  .nav-item .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-3); flex-shrink: 0;
  }
  .nav-item.active .dot { background: var(--accent); }

  #sidebar .foot {
    padding: 12px 16px; font-size: 10px; color: var(--text-3);
    border-top: 1px solid var(--border);
  }

  /* ─── Colonne de droite : barre d'outils + contenu ────────── */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  #topbar {
    flex-shrink: 0; height: 46px;
    display: flex; align-items: center; justify-content: flex-end;
    padding: 0 14px; gap: 10px;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }

  #logout-btn {
    background: transparent; border: 1px solid var(--border-hi);
    color: var(--text-2); font-size: 11px; padding: 6px 12px;
    border-radius: 6px; cursor: pointer; font-family: inherit;
  }
  #logout-btn:hover { color: var(--danger); border-color: var(--danger); }

  /* ─── Content ───────────────────────────────────────────── */
  #content { flex: 1; position: relative; background: var(--bg); }
  #content iframe {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: none; background: #fff;
  }
  #content .placeholder {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
    color: var(--text-3); font-size: 13px;
  }
</style>
</head>
<body>

<div id="gate">
  <div class="brand">Central&nbsp;&nbsp;Hub</div>
  <input id="pin-input" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
  <div class="error" id="pin-error"></div>
  <button id="bio-btn" class="bio-btn hidden">Déverrouiller avec Face ID / empreinte</button>
  <div id="bio-offer" class="bio-offer hidden">
    <div>Activer le déverrouillage rapide (Face ID / empreinte) sur cet appareil ?</div>
    <div class="bio-offer-actions">
      <button id="bio-offer-yes">Oui</button>
      <button id="bio-offer-no">Non merci</button>
    </div>
  </div>
</div>

<div id="shell" class="hidden">
  <div id="sidebar">
    <div class="logo"><span>Central</span>&nbsp;Hub</div>
    <div id="nav"></div>
    <div class="foot">Privé — David</div>
  </div>
  <button id="sidebar-toggle" title="Replier / déplier le menu">&#10094;</button>
  <div id="main">
    <div id="topbar">
      <button id="logout-btn" title="Se déconnecter">Déconnexion</button>
    </div>
    <div id="content">
      <div class="placeholder">Choisis un dashboard à gauche</div>
    </div>
  </div>
</div>

<script>
  // ── Config : liste des dashboards ────────────────────────
  // Pour ajouter un dashboard plus tard : ajouter une ligne ici.
  const DASHBOARDS = [
    { name: "Santé système", url: "sante/" },
    { name: "Daily",  url: "https://light-lab701.github.io/daily-marches/" },
    { name: "Weekly", url: "https://light-lab701.github.io/daily-marches/weekly/" },
    { name: "BRVM Radar", url: "brvm/" },
    { name: "État du coffre", url: "coffre/" },
    { name: "Journal de trading", url: "journal/" },
    { name: "Newsletter-Hotmail", url: "newsletter-hotmail/" },
    { name: "Actualités", url: "https://light-lab701.github.io/daily-marches/newsletter/" },
    { name: "Indicateurs économiques", url: "indicateurs/" },
    { name: "Veille actions US", url: "veille-actions-us/" },
  ];

  // ── PIN gate + biométrie + verrou d'inactivité (15 min) ────
  // Hash SHA-256 du code à 4 chiffres (jamais stocké en clair ici).
  const PIN_HASH = "d83036ffb5b49a153bc391fd12b4a10df06bbb200f39fed97c331b03b6833ce7";
  const UNLOCK_KEY = "terminal_unlocked_v1";
  const LAST_DASH_KEY = "hub_last_dashboard";
  const LAST_ACTIVITY_KEY = "hub_last_activity";
  const BIO_CRED_KEY = "hub_webauthn_cred_id";
  const INACTIVITY_MS = 15 * 60 * 1000;

  async function sha256(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  }

  function bufToB64(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))); }
  function b64ToBuf(b64) { return Uint8Array.from(atob(b64), c => c.charCodeAt(0)); }

  async function bioAvailable() {
    return !!(window.PublicKeyCredential &&
      await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().catch(() => false));
  }

  async function bioRegister() {
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        rp: { name: "Central Hub" },
        user: { id: crypto.getRandomValues(new Uint8Array(16)), name: "david", displayName: "David" },
        pubKeyCredParams: [{ alg: -7, type: "public-key" }, { alg: -257, type: "public-key" }],
        authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
        timeout: 60000
      }
    });
    localStorage.setItem(BIO_CRED_KEY, bufToB64(cred.rawId));
  }

  async function bioUnlock() {
    const credId = localStorage.getItem(BIO_CRED_KEY);
    if (!credId) return false;
    try {
      await navigator.credentials.get({
        publicKey: {
          challenge: crypto.getRandomValues(new Uint8Array(32)),
          allowCredentials: [{ id: b64ToBuf(credId), type: "public-key" }],
          userVerification: "required",
          timeout: 60000
        }
      });
      return true;
    } catch (e) {
      return false;
    }
  }

  const gate = document.getElementById("gate");
  const shellEl = document.getElementById("shell");
  const pinInput = document.getElementById("pin-input");
  const pinError = document.getElementById("pin-error");
  const bioBtn = document.getElementById("bio-btn");
  const bioOffer = document.getElementById("bio-offer");

  function touchActivity() { localStorage.setItem(LAST_ACTIVITY_KEY, String(Date.now())); }

  function showShell() {
    gate.classList.add("hidden");
    shellEl.classList.remove("hidden");
    localStorage.setItem(UNLOCK_KEY, "1");
    touchActivity();
    initNav();
  }

  async function setupBioButton() {
    bioBtn.classList.add("hidden");
    if (localStorage.getItem(BIO_CRED_KEY) && await bioAvailable()) {
      bioBtn.classList.remove("hidden");
    }
  }

  function lock() {
    shellEl.classList.add("hidden");
    gate.classList.remove("hidden");
    bioOffer.classList.add("hidden");
    localStorage.removeItem(UNLOCK_KEY);
    pinInput.value = "";
    pinError.textContent = "";
    setupBioButton();
    pinInput.focus();
  }

  bioBtn.addEventListener("click", async () => {
    pinError.textContent = "";
    if (await bioUnlock()) showShell();
    else pinError.textContent = "Échec — utilise le code";
  });

  document.getElementById("bio-offer-yes").addEventListener("click", async () => {
    bioOffer.classList.add("hidden");
    try { await bioRegister(); } catch (e) { /* annulé ou non supporté, tant pis */ }
    showShell();
  });
  document.getElementById("bio-offer-no").addEventListener("click", () => {
    bioOffer.classList.add("hidden");
    showShell();
  });

  pinInput.addEventListener("input", async () => {
    if (pinInput.value.length !== 4) return;
    const hash = await sha256(pinInput.value);
    if (hash !== PIN_HASH) {
      pinError.textContent = "Code incorrect";
      pinInput.value = "";
      return;
    }
    pinError.textContent = "";
    // Premier code juste (pas de biométrie enregistrée) + appareil compatible
    // -> propose l'activation avant de révéler le shell.
    if (!localStorage.getItem(BIO_CRED_KEY) && await bioAvailable()) {
      bioOffer.classList.remove("hidden");
    } else {
      showShell();
    }
  });

  // ── Auto-verrouillage après 15 min d'inactivité ────────────
  ["mousemove", "keydown", "click", "touchstart", "scroll"].forEach(evt => {
    document.addEventListener(evt, () => {
      if (shellEl.classList.contains("hidden")) return;
      touchActivity();
    }, { passive: true });
  });

  function checkInactivity() {
    if (shellEl.classList.contains("hidden")) return;
    const last = Number(localStorage.getItem(LAST_ACTIVITY_KEY) || 0);
    if (Date.now() - last >= INACTIVITY_MS) lock();
  }

  setInterval(checkInactivity, 15000);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") checkInactivity();
  });

  // ── État initial ────────────────────────────────────────────
  (async () => {
    const last = Number(localStorage.getItem(LAST_ACTIVITY_KEY) || 0);
    if (localStorage.getItem(UNLOCK_KEY) === "1" && (Date.now() - last) < INACTIVITY_MS) {
      showShell();
    } else {
      localStorage.removeItem(UNLOCK_KEY);
      await setupBioButton();
      pinInput.focus();
    }
  })();

  // ── Déconnexion manuelle ──────────────────────────────────
  document.getElementById("logout-btn").addEventListener("click", () => {
    localStorage.removeItem(LAST_ACTIVITY_KEY);
    lock();
  });

  // ── Sidebar rétractable ──────────────────────────────────
  const shell = document.getElementById("shell");
  const sidebarToggle = document.getElementById("sidebar-toggle");
  sidebarToggle.addEventListener("click", () => {
    const collapsed = shell.classList.toggle("collapsed");
    sidebarToggle.innerHTML = collapsed ? "&#10095;" : "&#10094;";
  });

  // ── Sidebar / iframe switching ───────────────────────────
  function initNav() {
    const nav = document.getElementById("nav");
    const content = document.getElementById("content");
    nav.innerHTML = "";

    DASHBOARDS.forEach((d, i) => {
      const item = document.createElement("div");
      item.className = "nav-item";
      item.innerHTML = `<span class="dot"></span>${d.name}`;
      item.addEventListener("click", () => selectDashboard(i));
      nav.appendChild(item);
    });

    function selectDashboard(i) {
      [...nav.children].forEach((el, idx) => el.classList.toggle("active", idx === i));
      content.innerHTML = `<iframe src="${DASHBOARDS[i].url}" title="${DASHBOARDS[i].name}"></iframe>`;
      localStorage.setItem(LAST_DASH_KEY, DASHBOARDS[i].name);
    }

    // Réouvrir le dernier dashboard consulté (mémorisé par nom : robuste
    // si le menu est réordonné) ; sinon le premier de la liste.
    const lastName = localStorage.getItem(LAST_DASH_KEY);
    const lastIdx = DASHBOARDS.findIndex(d => d.name === lastName);
    if (DASHBOARDS.length > 0) selectDashboard(lastIdx >= 0 ? lastIdx : 0);
  }
</script>

</body>
</html>
